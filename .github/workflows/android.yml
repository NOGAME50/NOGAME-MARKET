name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet de lancer le workflow manuellement depuis GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      # C'est ici que ça se jouait ! On force l'initialisation de Capacitor
      - name: Initialize Capacitor
        run: npx cap init "NOGAME MARKET" com.nogame.market --web-dir dist

      # Ajout de la plateforme Android si elle n'existe pas déjà
      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # Synchroniser le code web (dist) avec le projet Android
      - name: Sync Capacitor
        run: npx cap sync android

      # Compiler l'APK avec Gradle
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Récupérer l'APK et le mettre à disposition
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Optionnel : Créer une Release GitHub automatiquement
      # - name: Create Release
      #   uses: softprops/action-gh-release@v2
      #   if: startsWith(github.ref, 'refs/tags/')
      #   with:
      #     files: android/app/build/outputs/apk/debug/app-debug.apk
